name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: cotali
          POSTGRES_PASSWORD: cotali
          POSTGRES_USER: cotali
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U cotali -d cotali"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://cotali:cotali@localhost:5432/cotali?schema=public
      DATABASE_URL_UNPOOLED: postgresql://cotali:cotali@localhost:5432/cotali?schema=public
      TEST_DATABASE_URL: postgresql://cotali:cotali@localhost:5432/cotali?schema=public

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack install

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level moderate

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Check types and schemas
        run: pnpm check

      - name: Apply migrations to a clean database
        run: pnpm --filter @cotali/database db:migrate:deploy

      - name: Create Prisma shadow database
        run: psql "$DATABASE_URL" -c 'CREATE DATABASE cotali_shadow;'

      - name: Check Prisma migration and schema drift
        run: >-
          pnpm --filter @cotali/database exec prisma migrate diff
          --from-migrations prisma/migrations
          --to-schema-datamodel prisma/schema.prisma
          --shadow-database-url postgresql://cotali:cotali@localhost:5432/cotali_shadow?schema=public
          --exit-code

      - name: Build API dependency graph for integration
        run: pnpm --filter @cotali/api... build

      - name: Test PostgreSQL integration
        run: >-
          pnpm --filter @cotali/api exec cross-env RUN_DATABASE_INTEGRATION=true
          vitest run
          src/quotes/prisma-quote-repository.integration.test.ts
          src/auth/auth-lifecycle.integration.test.ts
          src/security/security-audit-service.integration.test.ts
          src/auth/auth-timestamps.integration.test.ts
          src/security/otp-rate-limit-service.integration.test.ts

      - name: Run tests without cache
        run: |
          pnpm --filter @cotali/contracts test
          pnpm --filter @cotali/domain test
          pnpm --filter @cotali/database test
          pnpm --filter @cotali/voice test
          pnpm --filter @cotali/api test
          pnpm --filter @cotali/mobile test
          pnpm --filter @cotali/worker test
          pnpm --filter @cotali/web test

      - name: Build all applications
        run: |
          pnpm --filter @cotali/api... build
          pnpm --filter @cotali/mobile build
          pnpm --filter @cotali/web build
          pnpm --filter @cotali/worker build
